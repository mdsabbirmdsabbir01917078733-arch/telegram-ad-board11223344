<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Double Earning Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Monetag -->
<script src="https://libtl.com/sdk.js"></script>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f6f6f6;
}
.header{
  background:#b30000;
  color:white;
  padding:15px;
}
.card{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:12px;
}
.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#d10000;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
}
input,select{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="header">
  <b id="username">User</b><br>
  ID: <span id="uid"></span><br>
  Balance: ৳ <span id="balance">0</span>
</div>

<div class="card">
  <button class="btn" onclick="showAd()">🎬 Ad দেখুন</button>
  <button class="btn" onclick="showWithdraw()">📤 Withdraw</button>
  <button class="btn" onclick="showAd()">📋 Task</button>
</div>

<div class="card" id="withdrawBox" style="display:none;">
  <h3>Withdraw Request</h3>
  <select id="method">
    <option value="">Method Select</option>
    <option>Bkash</option>
    <option>Nagad</option>
    <option>Rocket</option>
  </select>
  <input type="text" id="number" placeholder="Number">
  <input type="number" id="amount" placeholder="Amount">
  <button class="btn" onclick="withdraw()">Submit</button>
</div>

<script>
// =======================
// 🔴 Firebase CONFIG
// 👉 এখানে তোমার Firebase API বসাবে
// =======================
var firebaseConfig = {
  apiKey: "",
  authDomain: "double-earning-bot.firebaseapp.com",
  databaseURL: "https://double-earning-bot-default-rtdb.firebaseio.com",
  projectId: "double-earning-bot",
  storageBucket: "double-earning-bot.firebasestorage.app",
  messagingSenderId: "155076870534",
  appId: "1:155076870534:web:0023206fbb40f56aafac07",
  measurementId: "G-HKT35XCSYH"
};
  
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// =======================
// 🔴 Telegram User
// =======================
const tg = window.Telegram.WebApp;
const user = tg.initDataUnsafe.user;

if(!user){
  document.body.innerHTML = "<h3>Open from Telegram Bot</h3>";
}

const userId = user.id;
document.getElementById("username").innerText = user.first_name;
document.getElementById("uid").innerText = userId;

// =======================
// 🔴 Load User
// =======================
const userRef = db.ref("users/"+userId);
userRef.once("value",snap=>{
  if(!snap.exists()){
    userRef.set({
      name:user.first_name,
      balance:0
    });
  }else{
    document.getElementById("balance").innerText = snap.val().balance;
  }
});

// =======================
// 🔴 Monetag Ad
// 👉 এখানে তোমার Monetag Zone ID বসাবে
// =======================
function showAd(){
  show_10420496(); // 🔁 এই ID রিপ্লেস করবে
}

// =======================
// 🔴 Withdraw
// =======================
function showWithdraw(){
  document.getElementById("withdrawBox").style.display="block";
}

function withdraw(){
  const method=document.getElementById("method").value;
  const number=document.getElementById("number").value;
  const amount=document.getElementById("amount").value;

  if(!method || !number || !amount){
    alert("সব তথ্য পূরণ করুন");
    return;
  }

  const wid=Date.now();
  db.ref("withdraw_requests/"+wid).set({
    userId:userId,
    name:user.first_name,
    method:method,
    number:number,
    amount:amount,
    status:"pending",
    time:Date.now()
  }).then(()=>{
    alert("Withdraw request sent ✅");
    document.getElementById("withdrawBox").style.display="none";
  });
}
</script>

</body>
</html>
